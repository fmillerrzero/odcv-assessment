            function setupAutosave() {
                form.addEventListener('change', () => {
                    const formData = new FormData(form);
                    const data = {};
                    
                    for (let [key, value] of formData) {
                        // Strip commas from squareFootage before saving to localStorage
                        if (key === 'squareFootage' && value) {
                            value = value.replace(/,/g, '');
                        }
                        data[key] = value;
                    }
                    
                    // Special handling for checkboxes
                    const checkboxValues = Array.from(
                        document.querySelectorAll('input[name="bmsDataPoints"]:checked')
                    ).map(cb => cb.value);
                    data.bmsDataPoints = checkboxValues;
                    
                    // Get address from the fields
                    const addressValueField = document.getElementById('addressValue');
                    const addressInput = document.getElementById('addressInput');
                    
                    if (addressValueField && addressValueField.value) {
                        data.address = addressValueField.value;
                    } else if (addressInput && addressInput.value) {
                        data.address = addressInput.value;
                    }
                    
                    data.currentStep = formState.currentStep;
                    data.completedSteps = formState.completedSteps;
                    localStorage.setItem('odcvFormData', JSON.stringify(data));
                });
                
                // Add special handling for checkbox changes
                document.querySelectorAll('input[name="bmsDataPoints"]').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const checkboxValues = Array.from(
                            document.querySelectorAll('input[name="bmsDataPoints"]:checked')
                        ).map(cb => cb.value);
                        
                        const formData = JSON.parse(localStorage.getItem('odcvFormData') || '{}');
                        formData.bmsDataPoints = checkboxValues;
                        localStorage.setItem('odcvFormData', JSON.stringify(formData));
                    });
                });
                
                // Special handling for address fields
                const addressInput = document.getElementById('addressInput');
                if (addressInput) {
                    addressInput.addEventListener('input', function() {
                        const formData = JSON.parse(localStorage.getItem('odcvFormData') || '{}');
                        formData.address = this.value;
                        document.getElementById('addressValue').value = this.value;
                        localStorage.setItem('odcvFormData', JSON.stringify(formData));
                    });
                }
            }

            function setupThousandsSeparator() {
                const squareFootage = document.getElementById('squareFootage');
                if (squareFootage) {
                    squareFootage.addEventListener('input', function () {
                        // Store cursor position
                        const start = this.selectionStart;
                        const end = this.selectionEnd;

                        // Get value without commas
                        const value = this.value.replace(/,/g, '');

                        // Add commas for display purposes only
                        if (value) {
                            const formattedValue = Number(value).toLocaleString('en-US');

                            // Only update if it actually changed
                            if (formattedValue !== this.value) {
                                // Update with commas
                                this.value = formattedValue;

                                // Adjust cursor position for added commas
                                const addedChars = this.value.length - value.length;
                                this.setSelectionRange(start + addedChars, end + addedChars);
                            }
                        }
                    });
                }
            }

            function restoreFormData() {
                if (formState.formData && Object.keys(formState.formData).length > 0) {
                    // Check if we have any meaningful data before showing restore prompt
                    const hasData = Object.entries(formState.formData).some(([key, value]) => {
                        return value && typeof value === 'string' && value.trim() !== '' && !key.startsWith('current');
                    });

                    if (hasData && confirm('We found your previously saved information. Would you like to restore it?')) {
                        // Restore form data
                        Object.entries(formState.formData).forEach(([key, value]) => {
                            if (key === 'currentStep') {
                                formState.currentStep = parseInt(value) || 1;
                            } else if (key === 'completedSteps' && Array.isArray(value)) {
                                formState.completedSteps = value;
                            } else if (key === 'bmsDataPoints' && Array.isArray(value)) {
                                // Handle checkbox restoration
                                value.forEach(dataPoint => {
                                    const checkbox = document.querySelector(`input[name="bmsDataPoints"][value="${dataPoint}"]`);
                                    if (checkbox) {
                                        checkbox.checked = true;
                                    }
                                });
                            } else if (key === 'address') {
                                // For address field, set both the hidden field and visible input
                                const addressValueField = document.getElementById('addressValue');
                                const addressInput = document.getElementById('addressInput');
                                
                                if (addressValueField) {
                                    addressValueField.value = value;
                                }
                                
                                if (addressInput) {
                                    addressInput.value = value;
                                }
                            } else {
                                const field = form.querySelector(`[name="${key}"]`);
                                if (field) {
                                    if (field.type === 'radio') {
                                        const radio = form.querySelector(`input[name="${key}"][value="${value}"]`);
                                        if (radio) {
                                            radio.checked = true;
                                            // Trigger change event to update conditional fields
                                            radio.dispatchEvent(new Event('change'));
                                        }
                                    } else {
                                        field.value = value;
                                        // Trigger change event to update cascading dropdowns
                                        field.dispatchEvent(new Event('change'));
                                    }
                                }
                            }
                        });

                        // Initialize cascading dropdowns based on restored values
                        initCascadingValues();

                        // Handle other fields visibility correctly
                        checkAndHandleOtherFields();
                    }
                }
            }

            // Initialize cascading dropdowns with saved values
            function initCascadingValues() {
                // BMS values
                const bmsManufacturer = document.getElementById('bmsManufacturer');
                const bmsPlatform = document.getElementById('bmsPlatform');

                if (bmsManufacturer && bmsManufacturer.value) {
                    updateBMSPlatforms(bmsManufacturer.value);
                    if (bmsPlatform && formState.formData.bmsPlatform) {
                        bmsPlatform.value = formState.formData.bmsPlatform;
                    }
                }

                // AHU values
                const ahuManufacturer = document.getElementById('ahuManufacturer');
                const ahuModel = document.getElementById('ahuModel');
                
                if (ahuManufacturer && ahuManufacturer.value) {
                    updateAHUModels(ahuManufacturer.value);
                    if (ahuModel && formState.formData.ahuModel) {
                        ahuModel.value = formState.formData.ahuModel;
                    }
                }

                // Show/hide conditional sections based on radio values
                const hasBMS = document.querySelector('input[name="hasBMS"]:checked');
                if (hasBMS) {
                    const bmsDetailsSection = document.getElementById('BMSInformationDiv');
                    const bmsDataPointsSection = document.getElementById('bmsDataPointsSection');
                    
                    if (hasBMS.value === 'Yes') {
                        if (bmsDetailsSection) {
                            bmsDetailsSection.classList.add('show');
                            bmsDetailsSection.querySelectorAll('input, select, textarea').forEach(field => {
                                field.disabled = false;
                            });
                        }
                        
                        if (bmsDataPointsSection) {
                            bmsDataPointsSection.classList.add('show');
                            bmsDataPointsSection.querySelectorAll('input, select, textarea').forEach(field => {
                                field.disabled = false;
                            });
                        }
                    }
                }

                const hasAHU = document.querySelector('input[name="hasAHU"]:checked');
                if (hasAHU) {
                    const ahuDetailsSection = document.getElementById('ahuDetailsSection');
                    
                    if (hasAHU.value === 'Yes') {
                        if (ahuDetailsSection) {
                            ahuDetailsSection.classList.add('show');
                            ahuDetailsSection.querySelectorAll('input, select, textarea').forEach(field => {
                                field.disabled = false;
                            });
                        }
                    }
                }
            }

            // Function to check and handle "Other" fields visibility properly during restore
            function checkAndHandleOtherFields() {
                // Check each select that might have an "Other" option
                const selectsWithOther = [
                    'jobTitle', 'orgType', 'buildingType', 'buildingOperatingHours',
                    'bmsManufacturer', 'bmsProtocol', 'ahuManufacturer'
                ];

                selectsWithOther.forEach(fieldName => {
                    const select = document.getElementById(fieldName);
                    const otherField = document.getElementById('other' + fieldName.charAt(0).toUpperCase() + fieldName.slice(1));

                    if (select && otherField) {
                        // Only show other field if "Other" is selected
                        if (select.value && select.value.toLowerCase() === 'other') {
                            otherField.style.display = 'block';
                            otherField.disabled = false;
                        } else {
                            otherField.style.display = 'none';
                            otherField.disabled = true;
                        }
                    }
                });
            }

            function setupDemoMode() {
                demoBtn.addEventListener('click', () => {
                    form.reset();
                    
                    // First set the base data
                    const demoData = {
                        name: 'Jane Smith',
                        email: 'jane.smith@example.com',
                        phone: '(123) 456-7890',
                        jobTitle: 'building_engineer',
                        organization: 'Demo Corp',
                        orgType: 'Owner',
                        buildingType: 'office',
                        buildingOperatingHours: 'standard',
                        squareFootage: '100000',
                        floors: '20',
                        hasBMS: 'Yes',
                        hasAHU: 'Yes',
                        ahuCount: '20',
                        floorsPerAHU: '1',
                        bmsManufacturer: 'Johnson Controls',
                        bmsProtocol: 'BACnet/IP'
                    };

                    // Apply demo data to form fields
                    Object.entries(demoData).forEach(([key, value]) => {
                        const field = form.querySelector(`[name="${key}"]`);
                        if (field) {
                            if (field.type === 'radio') {
                                const radio = form.querySelector(`input[name="${key}"][value="${value}"]`);
                                if (radio) {
                                    radio.checked = true;
                                    radio.dispatchEvent(new Event('change'));
                                }
                            } else {
                                field.value = value;
                                field.dispatchEvent(new Event('change'));
                            }
                        }
                    });

                    // Set address fields
                    document.getElementById('addressInput').value = '123 Main St, San Francisco, CA 94105';
                    document.getElementById('addressValue').value = '123 Main St, San Francisco, CA 94105';

                    // Setup BMS Platform and AHU Model
                    updateBMSPlatforms('Johnson Controls');
                    document.getElementById('bmsPlatform').value = 'Metasys';

                    updateAHUModels('Trane');
                    document.getElementById('ahuModel').value = 'IntelliPak™ I';
                    
                    // Set AHU manufacturer
                    document.getElementById('ahuManufacturer').value = 'Trane';
                    
                    // Check all BMS data points checkboxes
                    ['bmsDataSupplyAirflow', 'bmsDataFanSpeed', 'bmsDataOADamper', 'bmsDataSupplyTemp', 'bmsDataZoneTempSetpoint'].forEach(id => {
                        document.getElementById(id).checked = true;
                    });
                    
                    // Update button state
                    updateButtonStates();
                });
            }

            // Initialize the form
            function initializeForm() {
                setupNavigation();
                setupConditionalFields();
                setupCascadingSelects();
                setupValidation();
                setupDemoMode();
                setupAutosave();
                setupProgressClicks();
                setupHashNavigation();
                setupThousandsSeparator();
                
                // Restore saved data if available
                restoreFormData();
                
                // Initial state update based on URL or defaults
                const initialStep = getStepFromHash() || formState.currentStep;
                navigateTo(initialStep, { skipValidation: true, updateHash: false });
                
                // Update button states on initial load
                updateButtonStates();
            }
        });
    </script>
</body>
</html>
